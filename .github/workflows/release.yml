name: Create Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag name (e.g., 1.0.0, 2024-01-15, release-candidate-1)'
                required: true
                type: string

permissions:
    contents: write

jobs:
    # Pre-release validation - Run all CI checks before creating release
    pre-release-checks:
        name: Pre-Release CI Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Aggregate products
              run: bun run aggregate:products

            - name: Run ESLint
              run: bun run lint

            - name: Check formatting
              run: bunx prettier --check .

            - name: TypeScript type checking
              run: bun run tsc

            - name: Run tests
              run: bun test

            - name: Validate all data
              run: bun run validate:all

            - name: Build project
              run: bun run build

            - name: All checks passed
              run: |
                  echo "✅ All pre-release checks passed!"
                  echo "✅ Lint: Passed"
                  echo "✅ Format: Passed"
                  echo "✅ Type Check: Passed"
                  echo "✅ Tests: Passed"
                  echo "✅ Data Validation: Passed"
                  echo "✅ Build: Passed"

    release:
        name: Create Tag and Release
        runs-on: ubuntu-latest
        needs: pre-release-checks
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Update version and changelog
              run: |
                  # Update package.json version
                  bun run release:update-version ${{ inputs.tag }}

                  # Update bun.lock
                  bun install

                  # Generate changelog
                  bun run release:changelog

                  # Commit changes to main
                  git add package.json bun.lock CHANGELOG.md
                  git commit -m "chore(release): ${{ inputs.tag }}"
                  git push origin HEAD:main

            - name: Create and push tag
              run: |
                  # Create tag pointing to the release commit
                  git tag "${{ inputs.tag }}"
                  git push origin "${{ inputs.tag }}"

            - name: Extract changelog for release notes
              id: changelog
              run: |
                  # Check if CHANGELOG.md exists
                  if [ -f CHANGELOG.md ]; then
                      # Extract the latest version section from CHANGELOG.md
                      NOTES=$(awk '/^## \[?[0-9]/{if(p) exit; p=1} p' CHANGELOG.md)
                  else
                      # Provide default notes if CHANGELOG.md doesn't exist
                      NOTES="Release ${{ inputs.tag }}"
                  fi
                  # Handle multi-line output
                  echo "notes<<EOF" >> $GITHUB_OUTPUT
                  echo "$NOTES" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag }}
                  name: Release ${{ inputs.tag }}
                  body: ${{ steps.changelog.outputs.notes }}
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Merge to production branch
              run: |
                  # Fetch the production branch
                  git fetch origin production:production

                  # Checkout production branch
                  git checkout production

                  # Merge the tagged commit
                  git merge --ff-only ${{ inputs.tag }}

                  # Push to production (triggers Cloudflare Pages deployment)
                  git push origin production

                  # Return to original branch
                  git checkout main
